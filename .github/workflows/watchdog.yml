name: Sleeper Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watchdog
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FANTASYCALC_API_KEY: ${{ secrets.FANTASYCALC_API_KEY }}
        run: python -m src.main

      - name: Commit state changes
        run: |
          git config user.name "Sleeper Watchdog Bot"
          git config user.email "watchdog@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Pull before push to handle the race when a code push or another
            # cron tick lands on main between checkout and our push. Rebase
            # our state commit on top; --autostash protects any in-flight work.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep $((attempt * 5))
            done
          fi
