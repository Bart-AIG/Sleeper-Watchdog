      rule catches drift on those settings before they can let a violation through. Re-enable only if you find Sleeper letting
      a violation slip past correctly-configured settings.
- id: roster_oversight
  enabled: true
  severity: FLAG
  params:
    check_before_kickoff_minutes: 60
    eligible_replacement_filters:
      exclude_bye: true
      exclude_injury_statuses:
      - Out
      - IR
      - Doubtful
    strike_tracking:
      enabled: true
      max_strikes_before_removal: 3
      reset_at_season_end_if_under: 3
      notify_on_strike: true
    message: 'Article XIV: open starting slot detected with eligible bench replacement available.'
- id: lopsided_trade
