name: Sleeper Watchdog

on:
  workflow_dispatch: {}
  # schedule enabled in Phase 1, once a Discord webhook is wired up.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scaffold check
        run: echo "Sleeper Watchdog scaffold OK"
